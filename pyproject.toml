[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mset-experiment"
version = "0.2.0"
description = "Auditable scripted and learning-agent experiments for Machine Sovereignty Emergence Theory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MSET contributors"}]
dependencies = []

[project.optional-dependencies]
analysis = ["pandas", "pillow"]
language = ["mlx-lm"]

[project.scripts]
mset = "mset.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
